<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Organigrama Institucional UIS — interactivo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <div class="top-rule"></div>
    <img src="assets/uis-marca.png" class="uis-brand" alt="Universidad Industrial de Santander" />
    <h1>ORGANIGRAMA INSTITUCIONAL</h1>

    <div class="main-tools">
      <button id="editBtn" class="btn edit">✎ Editar organigrama</button>
      <button id="expandBtn" class="btn">⊞ Desplegar todo</button>
      <button id="collapseBtn" class="btn">⊟ Contraer todo</button>
      <button id="resetBtn" class="btn subtle">↺ Restablecer</button>
    </div>
  </header>

  <section id="editBar" class="edit-bar is-hidden" aria-label="Herramientas de edición">
    <div class="edit-bar-left">
      <strong>Modo edición</strong>
      <span class="edit-help">Arrastra cualquier casilla para moverla. Las líneas se ajustan automáticamente.</span>
    </div>
    <div class="edit-actions">
      <button id="addBtn" class="btn primary">＋ Agregar casilla</button>
      <button id="renameBtn" class="btn" disabled>Renombrar</button>
      <button id="parentBtn" class="btn" disabled>Cambiar dependencia</button>
      <button id="deleteBtn" class="btn danger" disabled>Eliminar</button>
      <button id="doneBtn" class="btn primary">✓ Terminar edición</button>
    </div>
  </section>

  <main>
    <div class="canvas-shell" id="canvasShell">
      <div id="orgCanvas" class="org-canvas" aria-label="Organigrama UIS">
        <svg id="connections" class="connections" aria-hidden="true"></svg>
        <div id="nodesLayer" class="nodes-layer"></div>
      </div>
    </div>

    <div class="footer-row">
      <div class="legend">
        <div><span class="legend-line"></span><span>Relación jerárquica</span></div>
        <div><span class="legend-line dotted"></span><span>Relación de asesoría o apoyo</span></div>
        <div><span class="legend-yellow"></span><span>Unidad / sede destacada</span></div>
      </div>
      <div class="save-note"><span></span>Los cambios se guardan automáticamente en este navegador.</div>
    </div>
  </main>

  <dialog id="nodeDialog" class="node-dialog">
    <form id="nodeForm" method="dialog">
      <div class="dialog-head">
        <h2 id="dialogTitle">Agregar casilla</h2>
        <button class="x-btn" value="cancel" aria-label="Cerrar">×</button>
      </div>

      <div class="dialog-body">
        <label>
          Texto de la casilla
          <textarea id="labelInput" rows="3" required></textarea>
        </label>

        <label id="parentWrap">
          Depende de
          <select id="parentSelect"></select>
        </label>

        <div class="two-cols">
          <label>
            Tipo de relación
            <select id="relationSelect">
              <option value="hierarchical">Jerárquica</option>
              <option value="advisory">Asesoría o apoyo</option>
            </select>
          </label>

          <label>
            Estilo de casilla
            <select id="styleSelect">
              <option value="normal">Normal</option>
              <option value="highlight">Destacada (amarillo)</option>
            </select>
          </label>
        </div>
      </div>

      <div class="dialog-foot">
        <button class="btn subtle" value="cancel">Cancelar</button>
        <button id="saveDialogBtn" class="btn primary" type="button">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
